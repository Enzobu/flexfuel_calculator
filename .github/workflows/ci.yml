name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    outputs:
      needs_fix: ${{ steps.eslint.outputs.needs_fix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (dry-run)
        id: eslint
        run: |
          set -euo pipefail
          npx eslint . --fix-dry-run --format json > eslint-report.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('eslint-report.json', 'utf8') || '[]');
          const totals = report.reduce(
            (acc, file) => {
              acc.error += file.errorCount || 0;
              acc.warning += file.warningCount || 0;
              acc.fixableError += file.fixableErrorCount || 0;
              acc.fixableWarning += file.fixableWarningCount || 0;
              return acc;
            },
            { error: 0, warning: 0, fixableError: 0, fixableWarning: 0 }
          );
          const hasOutput = report.some(
            (file) => typeof file.output === 'string' && file.output.length > 0
          );
          const total = totals.error + totals.warning;
          const fixable = totals.fixableError + totals.fixableWarning;
          const output = process.env.GITHUB_OUTPUT;

          if (total === 0 && !hasOutput) {
            fs.appendFileSync(output, 'needs_fix=false\n');
            process.exit(0);
          }

          if ((total > 0 && total === fixable) || (total === 0 && hasOutput)) {
            console.log('::warning::ESLint found fixable issues. Auto-fix will run on push.');
            fs.appendFileSync(output, 'needs_fix=true\n');
            process.exit(0);
          }

          console.error('::error::ESLint found non-fixable issues.');
          process.exit(1);
          NODE

  eslint-apply:
    name: ESLint (apply on failure)
    runs-on: ubuntu-latest
    needs: eslint
    if: >-
      ${{ needs.eslint.outputs.needs_fix == 'true' &&
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint (apply)
        run: npx eslint . --fix

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply eslint fixes"
          git push

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    outputs:
      needs_fix: ${{ steps.prettier.outputs.needs_fix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (check)
        id: prettier
        run: |
          set +e
          npx prettier --check .
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "needs_fix=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$code" -eq 1 ]; then
            echo "::warning::Prettier found formatting issues. Auto-fix will run on push."
            echo "needs_fix=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::Prettier failed with exit code ${code}."
          exit "$code"

  prettier-apply:
    name: Prettier (apply on failure)
    runs-on: ubuntu-latest
    needs: prettier
    if: >-
      ${{ needs.prettier.outputs.needs_fix == 'true' &&
      github.event_name == 'push' &&
      github.actor != 'github-actions[bot]' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Prettier (apply)
        run: npx prettier --write .

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply prettier formatting"
          git push

  docker-build-prod:
    name: Docker Build (prod)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production image
        run: docker build -t app-prod:ci .

      - name: Start container
        run: docker run -d -p 8080:80 --name app-prod-ci app-prod:ci

      - name: Smoke test HTTP
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "App did not respond in time."
          docker logs app-prod-ci
          exit 1

      - name: Smoke test nginx config
        run: docker run --rm app-prod:ci nginx -t

      - name: Stop container
        if: always()
        run: docker rm -f app-prod-ci
